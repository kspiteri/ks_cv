<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="" />
  <title>CV</title>
  <!-- Prevent flash of wrong theme — must run before CSS paints -->
  <script>
    (function () {
      var t = localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="./styles/base.css" />
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <header class="site-header" role="banner">
    <nav class="section-nav" aria-label="Page sections"></nav>
    <button id="theme-toggle" aria-label="Toggle theme" aria-pressed="false" type="button"></button>
  </header>
  <main id="main">
    <section id="hero"       class="section section--hero"       aria-label="Introduction"></section>
    <section id="experience" class="section section--experience" aria-label="Experience"></section>
    <section id="projects"   class="section section--projects"   aria-label="Projects"></section>
    <section id="skills"     class="section section--skills"     aria-label="Skills"></section>
    <section id="education"  class="section section--education"  aria-label="Education"></section>
  </main>
  <footer class="site-footer"></footer>
  <script type="module" src="./ts/main.ts"></script>
</body>
</html>
